version: '3.8'

services:
  app:
    build: .
    ports:
      - "8081:8080"
    volumes:
      - ./internal/firebase/serviceAccountKey.json:/app/internal/firebase/serviceAccountKey.json
      - ./internal/config/.env:/app/internal/config/.env
    environment:
      RUNNING_IN_DOCKER: true
      POSTGRES_HOST: ${DB_HOST_FOR_DOCKER}
      POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      - postgres_db
    networks:
      - app_network

  postgres_db:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
